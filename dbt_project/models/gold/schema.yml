version: 2

models:
  - name: gold_feature_daily
    description: Routing-agent features, one row per user per event day.
    data_tests:
      - dbt_utils_free_unique_combination:
          columns: [user_id, event_date]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
